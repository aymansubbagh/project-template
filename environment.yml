# Local development environment.
# Create:  mamba env create -f environment.yml
# Update:  mamba env update -f environment.yml --prune
# Rename `name:` for each new project.
name: project_name
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - jupyterlab
  - ipykernel
  - pytest
  - pytest-cov
  - ruff
  - pre-commit
  - pip
  - pip:
      - -e .
